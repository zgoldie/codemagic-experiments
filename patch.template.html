<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From CodePush to Patch · Codemagic</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/metropolis@5.2.5/400.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/metropolis@5.2.5/600.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/metropolis@5.2.5/700.min.css" />
  <style>
    :root {
      --nobugblue: #0031EA;
      --neverblue: #0051FF;
      --continuousblue: #008BF7;
      --dashaqua: #00CEFF;
      --cta-blue: #0957FF;
      --cta-blue-hover: #0031EA;
      --link-hover-light: #0957FF;
      --link-hover-dark: #FF9100;
      --font-core: "Metropolis", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --weight-bold: 700;
      --weight-semibold: 600;
      --weight-regular: 400;
      --tracking-all: -0.2px;
      --leading-heading: 1.26;
      --leading-body: 1.5;
      --size-title: 54px;
      --size-h1: 42px;
      --size-h2: 34px;
      --size-h3: 28px;
      --size-h4: 22px;
      --size-h5: 18px;
      --size-paragraph-lg: 18px;
      --size-paragraph-md: 16px;
      --size-paragraph-sm: 14px;
      --size-action-sm: 14px;
      --size-nav: 14px;
      --type-title: var(--weight-bold) var(--size-title) / var(--leading-heading) var(--font-core);
      --type-h1: var(--weight-bold) var(--size-h1) / var(--leading-heading) var(--font-core);
      --type-h2: var(--weight-bold) var(--size-h2) / var(--leading-heading) var(--font-core);
      --type-h4: var(--weight-bold) var(--size-h4) / var(--leading-heading) var(--font-core);
      --type-h5: var(--weight-bold) var(--size-h5) / var(--leading-heading) var(--font-core);
      --type-paragraph-lg: var(--weight-regular) var(--size-paragraph-lg) / var(--leading-body) var(--font-core);
      --type-paragraph-md: var(--weight-regular) var(--size-paragraph-md) / var(--leading-body) var(--font-core);
      --type-paragraph-sm: var(--weight-regular) var(--size-paragraph-sm) / var(--leading-body) var(--font-core);
      --type-action-sm: var(--weight-semibold) var(--size-action-sm) / var(--leading-body) var(--font-core);
      --type-nav: var(--weight-semibold) var(--size-nav) / var(--leading-body) var(--font-core);
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-button: 12px;
      --shadow-card: 0 1px 2px rgba(11, 17, 32, 0.06), 0 8px 24px rgba(11, 17, 32, 0.08);
      --rail-w: 52px;
    }
    @media (max-width: 1024px) {
      :root { --size-title: 42px; --size-h1: 34px; --size-h2: 28px; }
    }
    @media (max-width: 768px) {
      :root {
        --size-title: 32px;
        --size-h1: 26px;
        --size-h2: 24px;
        --size-h4: 20px;
        --size-paragraph-lg: 16px;
        --size-paragraph-md: 14px;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--font-core); }
    a { color: var(--cta-blue); text-decoration: none; }
    img, svg { max-width: 100%; }
    h1, h2, h3, p { margin: 0; }

    .pg {
      --surface-page: #E8EEF6;
      --text-toolbar: #11285B;
      --slide-bg: #FFFFFF;
      --slide-text: #11285B;
      --slide-body: #3A4865;
      --slide-muted: #8494AE;
      --slide-rule: rgba(17, 40, 91, 0.10);
      --rail-bg: #11285B;
      --rail-text: #FFFFFF;
      --rail-num-bg: #0B1C44;
      font-family: var(--font-core);
      letter-spacing: var(--tracking-all);
      background: var(--surface-page);
      color: var(--text-toolbar);
      min-height: 100vh;
    }
    .pg.dark {
      --surface-page: #01091A;
      --text-toolbar: #D2DBEE;
      --slide-bg: #101A2C;
      --slide-text: #FFFFFF;
      --slide-body: #D2DBEE;
      --slide-muted: #7A8AA6;
      --slide-rule: rgba(255, 255, 255, 0.10);
      --rail-bg: #0A1220;
      --rail-text: #FFFFFF;
      --rail-num-bg: #0051FF;
    }

    .stage {
      position: relative;
      overflow: hidden;
      padding: clamp(20px, 4vw, 48px) 16px clamp(40px, 6vw, 72px);
    }
    .deck-wrap {
      position: relative;
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .deck {
      overflow: hidden;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .slide {
      display: grid;
      grid-template-columns: var(--rail-w) minmax(0, 1fr);
      min-height: min(72vh, 680px);
      background: var(--slide-bg);
      color: var(--slide-text);
      scroll-snap-align: start;
      scroll-margin-top: 12px;
    }

    .rail {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      background: var(--rail-bg);
      color: var(--rail-text);
    }
    .rail-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font: var(--type-action-sm);
      padding: 20px 0;
      text-align: center;
      align-self: center;
    }
    .rail-num {
      height: var(--rail-w);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--rail-num-bg);
      font: var(--type-action-sm);
    }

    .body-pad {
      padding: clamp(28px, 4.5vw, 52px) clamp(24px, 4vw, 48px) clamp(32px, 5vw, 56px);
      display: flex;
      flex-direction: column;
    }

    .cover,
    .close {
      --slide-bg: var(--nobugblue);
      --slide-text: #FFFFFF;
      --slide-body: rgba(255, 255, 255, 0.82);
      --slide-muted: rgba(255, 255, 255, 0.55);
      --rail-bg: #0026C4;
      --rail-num-bg: #001F9E;
      --slide-rule: rgba(255, 255, 255, 0.18);
    }
    .close { --slide-bg: var(--cta-blue); --rail-bg: #0746D6; --rail-num-bg: #0536B8; }
    .act { --slide-bg: #182238; }
    .pg:not(.dark) .act { --slide-bg: #F2F5FA; --rail-bg: #11285B; --rail-num-bg: #0B1C44; }

    .mark { height: 22px; width: auto; margin-bottom: 28px; }
    .cover h1 { font: var(--type-title); max-width: 12ch; }
    .body-pad > h2 { font: var(--type-h1); }
    .close h2 { font: var(--type-title); }
    .lede {
      font: var(--type-paragraph-lg);
      color: var(--slide-body);
      margin-top: 16px;
      max-width: 46ch;
    }
    .note {
      font: var(--type-paragraph-sm);
      color: var(--slide-muted);
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px 20px;
      margin-top: auto;
      padding-top: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 28px;
      border-radius: var(--radius-button);
      font: var(--type-action-sm);
      letter-spacing: var(--tracking-all);
      transition: background 0.2s ease, transform 0.1s ease, color 0.2s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary,
    .btn-primary:hover { background: #FFFFFF; color: var(--nobugblue); }
    .btn-primary:hover { background: #E8EEFC; color: var(--nobugblue); }
    .pg:not(.dark) .why .btn-primary,
    .pg:not(.dark) .act .btn-primary {
      background: var(--cta-blue);
      color: #FFFFFF;
    }
    .textlink {
      font: var(--type-action-sm);
      color: inherit;
      opacity: 0.9;
    }
    .textlink:hover { opacity: 1; }

    .rows {
      margin-top: 28px;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr);
      column-gap: 36px;
    }
    .row {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      padding: 20px 0;
      border-top: 1px solid var(--slide-rule);
      align-items: start;
      column-gap: 36px;
    }
    .row:first-child { border-top: 0; padding-top: 0; }
    .row h3 { font: var(--type-h2); max-width: 18ch; }
    .row p {
      font: var(--type-paragraph-md);
      color: var(--slide-body);
    }
    .prose {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 46ch;
    }
    .prose p {
      font: var(--type-paragraph-lg);
      color: var(--slide-body);
    }

    .mono { font-family: var(--font-mono); font-size: 0.92em; }

    .vid {
      margin-top: 28px;
      width: min(100%, 380px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--slide-rule);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      background: rgba(0, 0, 0, 0.16);
    }
    .demo .vid { width: min(100%, 640px); }
    .vid iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .vid-poster {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: inherit;
      text-decoration: none;
      position: relative;
    }
    .vid-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vid-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.28);
      transition: background 0.15s ease;
    }
    .vid-poster:hover .vid-play { background: rgba(0, 0, 0, 0.12); }
    .vid-play svg {
      width: 68px;
      height: 48px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s ease;
    }
    .vid-poster:hover .vid-play svg { transform: scale(1.08); }
    .colophon {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-top: 28px;
      font: var(--type-paragraph-sm);
      color: var(--slide-muted);
    }
    .colophon a { color: inherit; }
    .colophon a:hover { color: #FFFFFF; }

    @media (max-width: 1024px) {
      .rows { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr); }
    }
    @media (max-width: 768px) {
      .slide { grid-template-columns: 1fr; min-height: 0; }
      .rail {
        flex-direction: row;
        align-items: center;
        min-height: 44px;
        padding-left: 16px;
      }
      .rail-label {
        writing-mode: horizontal-tb;
        transform: none;
        padding: 0;
      }
      .rail-num { width: 44px; height: 44px; flex: none; margin-left: auto; }
      .rows { grid-template-columns: 1fr; }
      .row p { grid-column: auto; }
      .actions { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
    }

    @page {
      size: 1040px 576px;
      margin: 0;
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body, .pg {
        background: #01091A;
        width: 1040px;
        height: auto;
      }
      .stage {
        padding: 0;
        overflow: visible;
      }
      .deck-wrap { width: 1040px; }
      .deck {
        overflow: visible;
        border-radius: 0;
        box-shadow: none;
      }
      .slide {
        width: 1040px;
        min-height: 576px;
        height: auto;
        max-height: none;
        break-after: page;
        break-inside: avoid;
        overflow: visible;
        grid-template-columns: var(--rail-w) minmax(0, 1fr) !important;
      }
      .slide:last-child { break-after: auto; }
      .close { min-height: 576px; }
      .rows {
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr) !important;
      }
      .row p { grid-column: auto !important; }
      .rail {
        flex-direction: column !important;
        min-height: 0 !important;
        padding-left: 0 !important;
      }
      .rail-label {
        writing-mode: vertical-rl !important;
        transform: rotate(180deg) !important;
        padding: 20px 0 !important;
      }
      .rail-num {
        width: auto !important;
        height: var(--rail-w) !important;
        margin-left: 0 !important;
      }
      .actions { flex-direction: row !important; }
      .btn { width: auto !important; }
    }
  </style>
</head>
<body>
  <div class="pg dark">
    <div class="stage">
      <div class="deck-wrap">
        <div class="deck">
{{deck}}
        </div>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll("[data-youtube]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-youtube");
        el.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
          '?autoplay=1" title="Patch demo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
      }, { once: true });
    });
  </script>
</body>
</html>
